name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend e PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: otimizador_testes
          POSTGRES_USER: otimizador
          POSTGRES_PASSWORD: otimizador_testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otimizador -d otimizador_testes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://otimizador:otimizador_testes@localhost:5432/otimizador_testes
      TEST_DATABASE_URL: postgresql+psycopg://otimizador:otimizador_testes@localhost:5432/otimizador_testes
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar CBC e dependências Python
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y coinor-cbc
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Aplicar migrações no PostgreSQL
        working-directory: backend
        run: alembic -c alembic.ini upgrade head

      - name: Executar testes
        run: python -m pytest -q

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar testes da interface
        working-directory: frontend
        run: npm test

      - name: Gerar build de produção
        working-directory: frontend
        run: npm run build

  containers:
    name: Smoke test Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar configuração
        run: docker compose config --quiet

      - name: Construir e iniciar serviços
        run: docker compose up --build --detach --wait

      - name: Verificar API e interface
        run: |
          curl --fail --show-error http://localhost:8000/health
          curl --fail --show-error http://localhost:5173/

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar serviços
        if: always()
        run: docker compose down --volumes
